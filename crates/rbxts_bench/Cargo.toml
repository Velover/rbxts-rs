[package]
name = "rbxts_bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rbxts_transform.workspace = true
rbxts_project.workspace = true
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_compiler.workspace = true
tsrs_diagnostics.workspace = true
mimalloc-safe.workspace = true
rbxts_luau.workspace = true
# luau-parity and project-parity, to read the dumps. The versions in tsrs's lock file; unbounded_depth for deep `..`
# chains.
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }

[[bin]]
name = "rbxts-bench"
path = "src/main.rs"
