[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# tsrs, pinned: a worktree of the tsrs clone on branch `rbxts-fork` (v0.18.0 plus visibility flips). Absolute paths,
# so that worktrees of this repo (under E:/Projects/TS/Flamework/worktrees) resolve them too.
# Cargo.lock started as a copy of tsrs's lock file so the transitive versions match what tsrs tests with.
[workspace.dependencies]
tsrs_core = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_core" }
tsrs_ast = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_ast" }
tsrs_vfs = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_vfs" }
tsrs_tsoptions = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_tsoptions" }
tsrs_compiler = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_compiler" }
tsrs_diagnostics = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_diagnostics" }
mimalloc-safe = { version = "0.1.67", features = ["v3", "no_thp"] }
rbxts_project = { path = "crates/rbxts_project" }
rbxts_luau = { path = "crates/rbxts_luau" }
# preserve_order: Rojo trees iterate children in file order, as JavaScript objects do.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tsrs_module = { path = "E:/Projects/TS/Flamework/worktrees/tsrs-rbxts-fork/crates/tsrs_module" }

# A debug checker is unusably slow, so even dev builds are optimised (as in tsrs).
[profile.dev]
opt-level = 3
lto = "off"
codegen-units = 256
incremental = true

# Measurements: release optimisation without LTO, like tsrs's `ci` profile (the tsrs.exe we compare against).
[profile.measure]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
